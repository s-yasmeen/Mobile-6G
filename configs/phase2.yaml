seed: 42
seeds: [11, 22, 33, 44, 55]
primary_dataset: mmhsense
secondary_dataset: operanet
utility_target: activity
privacy_target: identity
split:
  test_size: 0.20
  group_column: session
benchmarks:
  attackers: [logistic_regression, random_forest, mlp]
  privacy_metrics: [macro_ovr_auc, macro_f1, balanced_accuracy]
  utility_metrics: [macro_f1, balanced_accuracy]
  bootstrap_iterations: 1000
  confidence_level: 0.95
  chance_permutations: 200
  alpha: 0.05
phase3_release_counts: [1, 2, 5, 10, 20, 50]
