name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python experiments/run_smoke_test.py
      - run: python experiments/run_cumulative.py
      - name: Phase 2 benchmark smoke execution
        run: |
          python - <<'PY'
          import numpy as np,pandas as pd
          rng=np.random.default_rng(7); rows=[]
          for ident in range(3):
            for sess in range(4):
              for j in range(20):
                rows.append({'activity':j%2,'identity':ident,'session':f'{ident}-{sess}','f1':rng.normal()+j%2,'f2':rng.normal()+ident})
          pd.DataFrame(rows).to_csv('/tmp/p2.csv',index=False)
          PY
          python experiments/run_phase2_baselines.py --csv /tmp/p2.csv --permutations 2
